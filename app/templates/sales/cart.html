{% extends "base.html" %}
{% block title %}Корзина — АИС «ТехноМир»{% endblock %}

{% block content %}
<div class="page-head">
    <h1>Корзина</h1>
    <a href="{{ url_for('products.list_products') }}" class="btn">← К товарам</a>
</div>

{% if items %}
    <!-- ТУТ ТВОЙ КОД ТАБЛИЦЫ -->
    <table class="table">
        <!-- ... вся твоя таблица ... -->
    </table>

    <div class="cart-footer">
        <div class="cart-total">Итого: <strong>{{ "%.2f"|format(total) }} ₽</strong></div>
        <div class="cart-actions">
            <form method="post" action="{{ url_for('sales.clear_cart') }}" class="inline-form">
                <button type="submit" class="btn">Очистить</button>
            </form>
            <a href="{{ url_for('sales.checkout') }}" class="btn btn--primary">Оформить</a>
        </div>
    </div>
{% else %}
    <p class="text-muted">Корзина пуста. Добавьте товары из <a href="{{ url_for('products.list_products') }}">каталога</a>.</p>
{% endif %}
{% endblock %}
